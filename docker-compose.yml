# Local development only. Credentials below are throwaway local values.
#   docker compose up -d --build
#   docker compose run --rm wpcli    # first run: installs WP, activates theme + ACF
#   open http://localhost:8093  (admin / admin)

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8093:80"
    environment: &wp_env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      # Log notices to wp-content/debug.log instead of printing them in the page.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/themes/msstheme

  # One-shot setup container: `docker compose run --rm wpcli`
  wpcli:
    image: wordpress:cli-php8.2
    profiles: ["tools"]
    user: "33:33" # match www-data in the apache image
    depends_on:
      - wordpress
    environment:
      <<: *wp_env
      WP_URL: http://localhost:8093
    volumes:
      - wp_data:/var/www/html
      - .:/var/www/html/wp-content/themes/msstheme
      - ./docker/setup.sh:/usr/local/bin/setup.sh:ro
    entrypoint: ["sh", "/usr/local/bin/setup.sh"]

volumes:
  db_data:
  wp_data:
